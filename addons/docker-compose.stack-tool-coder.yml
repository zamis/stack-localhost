name: stack-tool-coder

networks:
  my-network-proxy:
    external: true

volumes:
  shared-home-coder:
    external: true
  shared-projects:
    external: true
  shared-local:
    external: true

services:  
  coder:
    restart: no
    image: localhost/coder
    privileged: true
    networks:
      - my-network-proxy
    expose:
      - 8080
    environment:
      - USERHOME=/home/ubuntu
    configs:
      - source: ssh_config
        target: /home/ubuntu/.ssh/config
        mode: 0600
        uid: "1000"
        gid: "1000"
      - source: context_host
        target: /home/ubuntu/.docker/contexts/meta/4740ae6347b0172c01254ff55bae5aff5199f4446e7f6d643d40185b3f475145/meta.json
        mode: 0444
        uid: "1000"
        gid: "1000"
      - source: context_rootless
        target: /home/ubuntu/.docker/contexts/meta/12b961af5feb3e9d39f93b2cefb9a1a944f18d02cca0cac2f04f5a982240605f/meta.json
        mode: 0444
        uid: "1000"
        gid: "1000"
    volumes:
      - shared-home-coder:/home/ubuntu
      - shared-projects:/external/shared-projects:rw
      - shared-local:/external/shared-local:rw
    labels:
      virtual.caddyfile: |
        http://coder.localhost {
          reverse_proxy http://coder:8080 {
          }
        }
        http://*.coder.localhost {
          # Довжина labels справа наліво: [0]=localhost, [1]=coder, [2]=<port>
          # reverse_proxy coder:{labels.2} {
          #   header_up X-Forwarded-Host {http.request.host}
          #   header_up X-Forwarded-Proto {http.request.scheme}
          # }

          rewrite * /proxy/{labels.2}{uri}
          reverse_proxy coder:8080 {
            # header_up X-Forwarded-Host {http.request.host}
            # header_up X-Forwarded-Proto {http.request.scheme}
          }
        }
      virtual.homefile: |
        <div>
          <a class="shadow" href="http://coder.localhost">coder</a>
          <small>http://coder.localhost</small>
        </div>


configs:
  ssh_config:
    content: |
      Host *
        IdentityFile /external/shared-projects/home/.ssh/id_rsa
        IdentitiesOnly yes
  context_host:
    content: |
      {"Name":"host","Metadata":{"Description":"Host mode"},"Endpoints":{"docker":{"Host":"unix:///var/run-host/docker.sock","SkipTLSVerify":false}}}
  context_rootless:
    content: |
      {"Name":"rootless","Metadata":{"Description":"Rootless mode"},"Endpoints":{"docker":{"Host":"unix:///var/run/user/docker.sock","SkipTLSVerify":false}}}
