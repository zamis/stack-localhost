name: stack-tool-fortinet

networks:
  my-network-proxy:
    external: true

volumes:
  stack-tool-fortinet-config:
    external: true

services:  
  fortinet:
    restart: no
    image: localhost/fortinet
    build:
      dockerfile_inline: |
        FROM jlesage/baseimage-gui:ubuntu-24.04-v4.13.2
        ENV DEBIAN_FRONTEND=noninteractive

        RUN apt-get update
        RUN rm /var/log
        RUN apt-get install -y software-properties-common
        RUN add-apt-repository universe -y
        RUN apt-get update
        RUN apt-get install -y sudo gosu supervisor
        RUN apt-get install -y curl gnupg ca-certificates openssl ssh git iputils-ping nmap socat encfs uidmap iproute2
        # RUN apt-get install -y --no-install-recommends \
        # curl \
        # gnupg \
        # ca-certificates \
        # openssl \
        # ssh \
        # git \
        # iputils-ping \
        # nmap \
        # socat \
        # encfs \
        # uidmap \
        # iproute2 \
        # libgtk2.0-bin \
        # libglib2.0-0 \
        # libnss3 \
        # libatk1.0-0 \
        # libatk-bridge2.0-0 \
        # libcups2 \
        # libdrm2 \
        # libgtk-3-0 \
        # libgbm1 \
        # libasound2t64 \
        # libcanberra-gtk3-module \
        # dbus \
        # dbus-x11 \
        # sudo

        RUN curl -fsSL https://repo.fortinet.com/repo/forticlient/7.4/ubuntu/DEB-GPG-KEY | gpg --dearmor -o /etc/apt/trusted.gpg.d/fortinet.gpg
        RUN echo "deb [arch=amd64 signed-by=/etc/apt/trusted.gpg.d/fortinet.gpg] https://repo.fortinet.com/repo/forticlient/7.4/ubuntu/ stable non-free" > /etc/apt/sources.list.d/fortinet.list
        RUN apt-get update
        RUN apt-get install -y forticlient
        RUN apt-get install -y libcanberra-gtk3-module
        RUN apt-get install -y dbus-x11
        
        RUN <<EOF
        echo '#!/bin/bash\n\
        if [ "$$1" == "--version" ]; then echo "pkexec version 0.105"; exit 0; fi
        if [ "$$1" == "--user" ]; then shift 2; fi
        exec /bin/bash -c "$$*"' > /usr/bin/pkexec
        chmod +x /usr/bin/pkexec
        EOF

        RUN set-cont-env APP_NAME "FortiClient"
        RUN echo 'app ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers.d/user
        RUN passwd -d app

        RUN cat <<'EOF' > /supervisord.conf
        [supervisord]
        nodaemon=true
        user=root
        pidfile=/var/run/supervisord.pid

        # [program:dbus]
        # command=dbus-daemon --system --nofork
        # autostart=true
        # autorestart=true
        # stdout_logfile=/dev/stdout
        # stdout_logfile_maxbytes=0
        # stderr_logfile=/dev/stderr
        # stderr_logfile_maxbytes=0

        # [program:main]
        # command=/init
        # autostart=true
        # autorestart=true
        # stdout_logfile=/dev/stdout
        # stdout_logfile_maxbytes=0
        # stderr_logfile=/dev/stderr
        # stderr_logfile_maxbytes=0
        EOF

        RUN cat <<'EOF' > /opt/patch-fs.js
        const fs = require('fs');
        const origWriteFile = fs.writeFile;
        fs.writeFile = function(path, data, options, callback) {
          if (typeof options === 'function') {
            callback = options;
            options = {};
          }
          callback = callback || (() => {});
          return origWriteFile.call(this, path, data, options, callback);
        };
        EOF

        RUN cat <<'EOF' > /startapp.sh
        #!/usr/bin/env bash
        set -ex
        # export ELECTRON_DISABLE_SANDBOX=1
        # export $$(dbus-launch)
        DBUS_SYSTEM_BUS_ADDRESS=$$DBUS_SESSION_BUS_ADDRESS
        echo DBUS_SYSTEM_BUS_ADDRESS=$$DBUS_SYSTEM_BUS_ADDRESS
        echo DBUS_SESSION_BUS_ADDRESS=$$DBUS_SESSION_BUS_ADDRESS
        export NODE_OPTIONS="--require /opt/patch-fs.js"
        ls /tmp
        ls /run
        sudo mkdir -p /run/dbus
        sudo chown -R 1000:1000 /run/dbus
        sudo ln -s /tmp/dbus.base /run/dbus/system_bus_socket
        sudo chown -R 1000:1000 /run/dbus
        id
        forticlient gui
        EOF
        RUN chmod +x /startapp.sh

        RUN cat <<'EOF' > /entrypoint.sh
        #!/usr/bin/env bash
        set -ex
        exec "$$@"
        EOF
        RUN chmod +x /entrypoint.sh

        ENV PS1="[fortinet] \u@\h:\[\033[0;36m\]\w\[\033[0m\]\$ "
        ENTRYPOINT ["/entrypoint.sh"]
        CMD ["/usr/bin/supervisord", "-c", "/supervisord.conf"]
    privileged: true
    cap_add:
      - NET_ADMIN
    networks:
      - my-network-proxy
    expose:
      - 5800
    devices:
      - /dev/net/tun
    # volumes:
    #   - /tmp/.X11-unix:/tmp/.X11-unix:ro
    #   # - stack-tool-fortinet-config:/home/ubuntu
    labels:
      virtual.caddyfile: |
        http://fortinet.localhost {
          reverse_proxy http://fortinet:5800 {
          }
        }
      virtual.homefile: |
        <div>
          <a class="shadow" href="http://fortinet.localhost">fortinet</a>
          <small>http://fortinet.localhost</small>
        </div>
