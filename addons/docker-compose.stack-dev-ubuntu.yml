name: stack-dev-ubuntu

networks:
  my-network-proxy:
    external: true

volumes:
  shared-home-ubuntu:
    external: true
  shared-apps:
    external: true
  shared-projects:
    external: true
  shared-local:
    external: true

services:
  ubuntu-dev:
    restart: unless-stopped
    privileged: true
    image: localhost/ubuntu
    configs:
      - source: custom_startup
        target: /custom_startup.sh
        mode: 0555
      - source: bashrc
        target: /home/kasm-user/.bashrc
        mode: 0555
    shm_size: 2gb
    security_opt:
      - apparmor=unconfined
      - seccomp=unconfined
    networks:
      - my-network-proxy
    expose:
      - 6901
    environment:
      KASM_PROFILE_LDR: ""
      KASM_USER: "kasm-user"
      VNC_USER: kasm_user
      VNC_PW: password
      # USER_DOCKER_HOST: dind-dev
      DOCKER_SOCK: /var/run/user/docker.sock
      # DOCKER_TLS_VERIFY: 1
      # DOCKER_TLS_CERTDIR: /certs
      # DOCKER_CERT_PATH: /certs/client
      XDG_RUNTIME_DIR: /run/user
      UB_IIT_SETTINGS_PATH: /home/kasm-user/tmp
      KASM_SVC_WEBCAM: 0
      KASM_SVC_PRINTER: 0
      KASM_SVC_AUDIO: 0
      KASM_SVC_AUDIO_INPUT: 0
      KASM_SVC_UPLOADS: 0
      KASM_SVC_GAMEPAD: 0
      KASM_SVC_SMARTCARD: 0
    devices:
      - /dev/fuse:/dev/fuse
    tmpfs:
      - /run:size=1M
    volumes:
      # - /etc/localtime:/etc/localtime:ro
      - shared-home-ubuntu:/home/kasm-user:rw
      - shared-apps:/var/mnt-links/shared-apps:rw
      - shared-projects:/var/mnt-links/shared-projects:rw
      - shared-local:/var/mnt-links/shared-local:rw
    cpu_shares: 128
    mem_limit: 8G
    labels:
      virtual.caddyfile: |
        http://ubuntu-dev.localhost {
          reverse_proxy ubuntu-dev:6901 {
            transport http {
              tls
              tls_insecure_skip_verify
            }
          }
        }
      virtual.homefile: |
        <div>
          <a class="shadow" href="http://ubuntu-dev.localhost">ubuntu-dev</a>
          <small>http://ubuntu-dev.localhost</small>
        </div>

configs:
  custom_startup:
    content: |
      #!/usr/bin/env bash
      set -ex
      mkdir -p /var/run/user && chmod 1777 /var/run/user
      mkdir -p $$XDG_RUNTIME_DIR && chown 1000:1000 $$XDG_RUNTIME_DIR
      gosu kasm-user mkdir -p /home/kasm-user/.local/share/docker
      export DOCKERD_ROOTLESS_ROOTLESSKIT_FLAGS="-p 0.0.0.0:2375:0.0.0.0:2375/tcp"
      # exec gosu kasm-user /usr/bin/desktop_ready && 
      exec gosu kasm-user /usr/bin/dockerd-rootless.sh -H unix:///var/run/user/docker.sock
      sleep 100s

  bashrc:
    content: |
      source $$STARTUPDIR/generate_container_user
      source /etc/profile

      export PATH=$$PATH:/home/kasm-user/bin:/home/kasm-user/.local/bin:/home/kasm-user/.dotnet/tools
      # export DOCKER_HOST: tcp://dind-dev:2376
      # export DOCKER_SOCK: unix:///var/run/docker.sock
      # export DOCKER_SOCK: unix:///var/run/user/1000/docker.sock
      
      $$STARTUP_EXEC
