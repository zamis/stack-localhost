name: stack-tool-peergos

networks:
  my-network-proxy:
    external: true

volumes:
  stack-tool-peergos-data:
    # external: true

services:
  peergos:
    restart: unless-stopped
    image: localhost/peergos
    build:
      dockerfile_inline: |
        FROM ghcr.io/peergos/web-ui:v1.31.0
        RUN apt-get update
        RUN apt install -y supervisor gosu uidmap socat nmap iproute2 iputils-ping openssl

        RUN echo -e '#!/bin/sh\necho "Браузер ігнорується: $1"' > /usr/bin/xdg-open
        RUN chmod +x /usr/bin/xdg-open

        # ENV USERAPP=root
        RUN cat << 'EOF' > /supervisord.conf
        [supervisord]
        nodaemon=true
        user=root
        pidfile=/var/run/supervisord.pid

        [program:Peergos-ui]
        workingdir=/opt/peergos
        command=/opt/peergos/docker-entrypoint.sh daemon -log-to-console true -listen-host 0.0.0.0 -public-domain localhost:7777 -public-server true -quota-upload-limit-seconds 600 -announce-ipfs-addresses /ip4/127.0.0.1/tcp/4001,/ip4/127.0.0.1/udp/4001/quic-v1
        # java --enable-native-access=ALL-UNNAMED -jar /opt/peergos/server/Peergos.jar -domain 0.0.0.0 -public-domain peergos:7777 -listen-host 0.0.0.0 --host-names 127.0.0.1,peergos,localhost,peergos.localhost -log-to-console true
        autostart=true
        autorestart=true
        stdout_logfile=/dev/stdout
        stdout_logfile_maxbytes=0
        stderr_logfile=/dev/stderr
        stderr_logfile_maxbytes=0

        # [program:Peergos]
        # workingdir=/opt/peergos
        # command=/opt/peergos/docker-entrypoint.sh daemon -public-server true -listen-host peergos.localhost -public-domain peergos.localhost:7777 -log-to-console true
        # autostart=true
        # autorestart=true
        # stdout_logfile=/dev/stdout
        # stdout_logfile_maxbytes=0
        # stderr_logfile=/dev/stderr
        # stderr_logfile_maxbytes=0

        [program:socat]
        command=socat TCP-LISTEN:8001,fork TCP4-CONNECT:localhost:7777
        autostart=true
        autorestart=true
        stdout_logfile=/dev/stdout
        stdout_logfile_maxbytes=0
        stderr_logfile=/dev/stderr
        stderr_logfile_maxbytes=0
        EOF

        RUN cat << 'EOF' > /entrypoint.sh
        #!/bin/sh
        set -ex
        # chown -R $$USERAPP:$$USERAPP /root/.config/anywherelan
        exec "$@"
        EOF
        RUN chmod +x /entrypoint.sh

        EXPOSE 4001 8001
        ENTRYPOINT ["/entrypoint.sh"]
        CMD ["/usr/bin/supervisord", "-c", "/supervisord.conf"]
    networks:
      - my-network-proxy
    extra_hosts:
      - host:host-gateway      
    expose:
      - 4001 # libp2p
      - 8000 # WEB
    volumes:
      - stack-tool-peergos-data:/opt/peergos/data
    labels:
      virtual.caddyfile: |
        http://peergos.localhost {
          reverse_proxy peergos:8001 {
            header_up Host "localhost:7777"
            header_down Host "peergos.localhost"
            header_up X-Forwarded-Host "localhost:7777"
            header_down X-Forwarded-Host "peergos.localhost"
            header_up X-Real-IP "localhost"
            header_down X-Real-IP "peergos.localhost"
          }
        }
      virtual.homefile: |
        <div>
          <a class="shadow" href="http://peergos.localhost">peergos</a>
          <small>http://peergos.localhost</small>
        </div>
