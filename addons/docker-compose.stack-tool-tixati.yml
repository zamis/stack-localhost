name: stack-tool-tixati

networks:
  my-network-proxy:
    external: true

volumes:
  stack-tool-tixati-config:
    external: true
  stack-tool-tixati-output:
    external: true

services:
  tixati:
    restart: no
    image: jlesage/tixati:v26.08.2
    shm_size: 2gb
    networks:
      - my-network-proxy
    expose:
      - 5800
    environment:
      SECURE_CONNECTION: 1
      VNC_PASSWORD: ""
      WEB_AUDIO: 1
      WEB_FILE_MANAGER: 1
      DARK_MODE: 1
      # DISPLAY_WIDTH: 1920
      # DISPLAY_HEIGHT: 1080
      KEEP_APP_RUNNING: 1
      TZ: Europe/Vienna
    volumes:
      - stack-tool-tixati-config:/config:rw
      - stack-tool-tixati-output:/output:rw
    labels:
      virtual.caddyfile: |
        http://tixati.localhost {
          reverse_proxy tixati:5800 {
            transport http {
              tls
              tls_insecure_skip_verify
            }
          }
        }
      virtual.homefile: |
        <div>
          <a class="shadow" href="http://tixati.localhost?resize=remote">tixati</a>
          <small>http://tixati.localhost</small>
        </div>
