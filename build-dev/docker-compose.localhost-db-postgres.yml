name: localhost-db-postgres

volumes:
  backup:
  data-17:

services:
  postgres-17:
    restart: unless-stopped
    image: postgres:17
    environment:
      POSTGRES_DB: "postgres"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
      BACKUP: "pg_dumpall -U postgres > /backup/pg/databases.sql"
      RESTORE: "psql -U postgres postgres < /backup/pg/databases.sql"
    ports:
      - 5432:5432
    volumes:
      - data-17:/var/lib/postgresql/data
      - backup:/backup
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
