name: build-localhost-dotnet

services:
  build-dotnet:
    restart: no
    image: localhost/dotnet
    build:
      dockerfile_inline: |
        FROM mcr.microsoft.com/dotnet/sdk:9.0 AS dotnet-9
        FROM mcr.microsoft.com/dotnet/sdk:10.0 AS dotnet-10
        
        FROM ubuntu:26.04
        RUN apt update
        RUN apt install -y gosu curl libicu-dev
        COPY --from=dotnet-9 /usr/share/dotnet /usr/share/dotnet
        COPY --from=dotnet-10 /usr/share/dotnet /usr/share/dotnet
        ENV DOTNET_ROOT=/usr/share/dotnet
        RUN ln -s /usr/share/dotnet/dotnet /usr/bin/dotnet

        RUN <<EOFG
        cat <<'EOF' > /app.sh
        #!/bin/sh
        export PS1="[dotnetd] \u@\h:\[\033[0;36m\]\w\[\033[0m\]\$ "
        export HOME="/home/ubuntu"
        exec "$$@"
        fi
        EOF
        chmod +x /app.sh

        cat <<'EOF' > /entrypoint.sh
        #!/bin/sh
        if [ "$(stat -c '%U' /sys/fs/cgroup)" = "nobody" ]; then 
          exec /app.sh "$$@"
        else
          if [ -n "$$UIDGID" ]; then
            exec gosu $$UIDGID /app.sh "$$@"
          else
            exec gosu ubuntu /app.sh "$$@"
          fi
        fi
        EOF
        chmod +x /entrypoint.sh
        EOFG

        WORKDIR /tmp/
        ENV PS1="[dotnetd] \u@\h:\[\033[0;36m\]\w\[\033[0m\]\$ "
        ENTRYPOINT ["/entrypoint.sh"]
        CMD ["/bin/bash"]
    network_mode: none
