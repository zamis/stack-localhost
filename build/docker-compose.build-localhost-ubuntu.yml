name: build-localhost-ubuntu

services:
  build-localhost-ubuntu:
    restart: no
    image: localhost/ubuntu
    build:
      dockerfile_inline: |
        FROM mcr.microsoft.com/dotnet/sdk:10.0 AS dotnet-10
        FROM mcr.microsoft.com/dotnet/sdk:11.0 AS dotnet-11

        FROM docker.io/kasmweb/core-ubuntu-noble:1.19.0

        USER root
        RUN mkdir /root/Desktop
        ENV HOME=/home/kasm-default-profile
        ENV STARTUPDIR=/dockerstartup
        ENV INST_SCRIPTS=$STARTUPDIR/install

        ENV DEBIAN_FRONTEND=noninteractive
        ENV SKIP_CLEAN=false
        ENV KASM_RX_HOME=$STARTUPDIR/kasmrx
        ENV DONT_PROMPT_WSL_INSTALL="No_Prompt_please"
        ENV INST_DIR=$STARTUPDIR/install

        WORKDIR $HOME

        RUN apt update
        RUN apt install -y software-properties-common apt-utils
        RUN add-apt-repository -y universe
        RUN add-apt-repository -y ppa:xtradeb/apps

        RUN curl -fsSL https://repo.fortinet.com/repo/forticlient/7.4/ubuntu/DEB-GPG-KEY | gpg --dearmor -o /etc/apt/trusted.gpg.d/fortinet.gpg
        RUN echo "deb [arch=amd64 signed-by=/etc/apt/trusted.gpg.d/fortinet.gpg] https://repo.fortinet.com/repo/forticlient/7.4/ubuntu/ stable non-free" > /etc/apt/sources.list.d/fortinet.list

        RUN apt update
        RUN apt install -y sudo gosu supervisor 
        RUN apt install -y curl gnupg ca-certificates openssl ssh git iputils-ping nmap socat encfs uidmap iproute2
        RUN apt install -y libfuse2t64 dbus-user-session coreutils e2fsprogs cryptsetup kpartx dialog
        RUN apt install -y htop mc thunar-archive-plugin
        RUN apt install -y chromium
        RUN apt install -y forticlient

        RUN mkdir -p /opt/nvm
        RUN curl -fsSL https://raw.githubusercontent.com/nvm-sh/nvm/v0.41.0/install.sh | NVM_DIR=/opt/nvm bash
        # RUN curl -fsSL https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb -o ./google-chrome.deb && apt -y install ./google-chrome.deb && rm ./google-chrome.deb
        RUN curl -fsSL https://get.docker.com | VERSION=29.9.3 bash

        COPY --from=dotnet-10 /usr/share/dotnet /usr/share/dotnet
        COPY --from=dotnet-11 /usr/share/dotnet /usr/share/dotnet
        ENV DOTNET_ROOT=/usr/share/dotnet

        RUN <<EOFG
        ln -s /home/kasm-user/mnt-links /var/mnt-links
        ln -s /usr/share/dotnet/dotnet /usr/bin/dotnet
        docker context create rootless --description "Rootless mode" --docker "host=unix:///var/run/user/docker.sock"
        docker context use rootless

        # echo 'kasm-user ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers.d/user
        echo -n 'kasm-user:password' | chpasswd
        passwd -d kasm-user

        echo 'kernel.unprivileged_userns_clone=1' >> /etc/sysctl.d/userns.conf
        echo 'net.ipv4.ip_unprivileged_port_start=0' >> /etc/sysctl.d/userns.conf
        echo 'fs.inotify.max_user_watches=524288' >> /etc/sysctl.d/userns.conf
        echo 'fs.inotify.max_user_instances=8192' >> /etc/sysctl.d/userns.conf

        update-ca-certificates
        # Create an empty cert9.db. This will be used by applications like Chrome
        if [ ! -d $$HOME/.pki/nssdb/ ]; then
            mkdir -p $$HOME/.pki/nssdb/
            certutil -N -d sql:$$HOME/.pki/nssdb/ --empty-password
            chown 1000:1000 $$HOME/.pki/nssdb/
        fi

        # Update all cert9.db instances with the CA
        for certDB in $$(find / -name "cert9.db")
        do
            certdir=$$(dirname $${certDB});
            echo "Updating $$certdir"
            # certutil -A -n "$$CERT_NAME" -t "TCu,," -i $$CERT_FILE -d sql:$$certdir
        done

        cat <<'EOF' > /usr/bin/chromium-hl
        #!/usr/bin/env bash
        # exec xvfb-run --server-args="-screen 0 1920x1080x24" chromium --no-sandbox --disable-dev-shm-usage $$@
        exec chromium --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu $$@
        EOF
        chmod 644 /usr/bin/chromium-hl 
        chmod +x /usr/bin/chromium-hl

        # mkdir -p /etc/profile.d
        cat <<'EOF' > /etc/profile.d/user-local-bin.sh
        export USERLOCALBIN="$$HOME/.local/bin"
        export USERDOTNETTOOLS="$$HOME/.dotnet/tools"
        export CHROME_BIN="chromium-hl"
        export PATH=$$PATH:$$USERLOCALBIN:$$USERDOTNETTOOLS
        if [ ! -d "$$USERLOCALBIN" ]; then
            mkdir -p "$$USERLOCALBIN"
        fi
        export NVM_DIR="$$HOME/.nvm"
        export NVM_SOURCE="/opt/nvm"
        if [ ! -d "$$NVM_DIR" ]; then
            mkdir -p "$$NVM_DIR"
        fi
        [ -s "$$NVM_SOURCE/nvm.sh" ] && \. "$$NVM_SOURCE/nvm.sh"
        [ -s "$$NVM_SOURCE/bash_completion" ] && \. "$$NVM_SOURCE/bash_completion"
        EOF
        chmod 644 /etc/profile.d/user-local-bin.sh

        chown 1000:0 $$HOME
        /dockerstartup/set_user_permission.sh $$HOME
        EOFG

        ENV USER=kasm-user
        ENV HOME=/home/$USER
        WORKDIR $HOME

        RUN <<EOFG
        mkdir -p $$HOME && chown -R 1000:0 $$HOME

        cat <<'EOF' > /supervisord.conf
        [supervisord]
        nodaemon=true
        user=root
        pidfile=/var/run/supervisord.pid

        [program:main]
        command=gosu kasm-user /dockerstartup/kasm_default_profile.sh /dockerstartup/vnc_startup.sh /dockerstartup/kasm_startup.sh --wait
        autostart=true
        autorestart=true
        stdout_logfile=/dev/stdout
        stdout_logfile_maxbytes=0
        stderr_logfile=/dev/stderr
        stderr_logfile_maxbytes=0

        [program:dbus]
        command=dbus-daemon --system --nofork
        autostart=true
        autorestart=true
        stdout_logfile=/dev/stdout
        stdout_logfile_maxbytes=0
        stderr_logfile=/dev/stderr
        stderr_logfile_maxbytes=0

        [program:fctsched]
        command=/opt/forticlient/fctsched
        autostart=true
        autorestart=true
        stdout_logfile=/dev/stdout
        stdout_logfile_maxbytes=0
        stderr_logfile=/dev/stderr
        stderr_logfile_maxbytes=0

        [program:custom]
        command=/custom_startup.sh
        autostart=true
        autorestart=true
        stdout_logfile=/dev/stdout
        stdout_logfile_maxbytes=0
        stderr_logfile=/dev/stderr
        stderr_logfile_maxbytes=0
        EOF

        cat <<'EOF' > /custom_startup.sh
        #!/bin/sh
        set -ex
        sleep 99999s
        EOF
        chmod +x /custom_startup.sh

        cat <<'EOF' > /entrypoint.sh
        #!/bin/sh
        set -ex
        exec "$@"
        EOF
        chmod +x /entrypoint.sh
        EOFG

        USER root
        EXPOSE 6901
        ENTRYPOINT ["/entrypoint.sh"]
        CMD ["/usr/bin/supervisord", "-c", "/supervisord.conf"]
    network_mode: none
    entrypoint: ["sleep", "1s"]
